services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resourcemanager
      POSTGRES_USER: resourcemanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resourcemanager}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resourcemanager -d resourcemanager"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=resourcemanager;Username=resourcemanager;Password=${POSTGRES_PASSWORD:-resourcemanager}
      ClientOrigins__0: http://localhost:8080
    ports:
      - "5080:8080"

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
