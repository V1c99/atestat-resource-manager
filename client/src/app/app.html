<header>
  <h1>Resource Manager</h1>
  <p>Rooms, vehicles and equipment for one organisation.</p>
</header>

<main>
  <aside>
    <app-resource-list
      [resources]="resources()"
      [selectedId]="selected()?.id ?? null"
      (picked)="pick($event)" />
  </aside>

  <section>
    @if (selected(); as resource) {
      <div class="week-bar">
        <button type="button" (click)="moveWeek(-1)">Previous</button>
        <span>{{ resource.name }}, week of {{ weekStart() | date: 'd MMMM y' }}</span>
        <button type="button" (click)="moveWeek(1)">Next</button>
      </div>

      <app-week-schedule
        [bookings]="bookings()"
        [weekStart]="weekStart()"
        (cancelled)="cancel($event)" />
    }
  </section>

  <aside>
    @if (selected(); as resource) {
      <app-booking-form [resource]="resource" [users]="users()" (saved)="loadWeek()" />
    }

  </aside>
</main>
